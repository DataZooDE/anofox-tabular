#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    strategy:
      matrix:
        duckdb_version: [v1.4.2, v1.4.3]
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@${{ matrix.duckdb_version }}
    with:
      duckdb_version: ${{ matrix.duckdb_version }}
      ci_tools_version: ${{ matrix.duckdb_version }}
      extension_name: anofox_tabular
      # Exclude WASM builds - extension uses features not compatible with WASM
      # (libpostal, libphonenumber, DNS/SMTP network operations)
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads

  # Disabled format and tidy checks - local development environment doesn't match CI formatter versions
  # code-quality-check:
  #   name: Code Quality Chec
  #   uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.4.2
