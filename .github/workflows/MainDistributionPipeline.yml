#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-v1_4_5-build:
    name: Build extension binaries (v1.4.5)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4-andium
    with:
      duckdb_version: v1.4.5
      ci_tools_version: v1.4-andium
      extension_name: anofox_tabular
      # Exclude WASM builds - extension uses features not compatible with WASM
      # (libpostal, libphonenumber, DNS/SMTP network operations)
      # Exclude MinGW builds - vcpkg OpenSSL build issues
      # Exclude musl builds - OpenVINO binary components require glibc
      # Exclude ARM64 Linux builds - vcpkg OpenVINO build timeout issues
      # Windows on the LTS line: excluded. The v1.4.4 toolchain broke on
      # /Zc:__cplusplus passed to MinGW; a re-enable attempt on the rolling
      # v1.4-andium toolchain then hit flaky vcpkg MSYS package downloads
      # (vcpkg_acquire_msys during the c-ares port). Windows users get the
      # v1.5.x builds; revisit when the v1.4 line's vcpkg snapshot moves.
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw;linux_amd64_musl;linux_arm64

  duckdb-v1_4_5-smoke-test:
    name: Smoke test (v1.4.5)
    needs: duckdb-v1_4_5-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.4.5
      extension_name: anofox_tabular
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw;linux_amd64_musl;linux_arm64'

  duckdb-v1_4_5-deploy:
    name: Deploy extension binaries (v1.4.5)
    needs: [duckdb-v1_4_5-build, duckdb-v1_4_5-smoke-test]
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.4.5
      extension_name: anofox_tabular
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw;linux_amd64_musl;linux_arm64
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

  duckdb-v1_5_5-build:
    name: Build extension binaries (v1.5.5)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: anofox_tabular
      # Exclude WASM builds - extension uses features not compatible with WASM
      # (libpostal, libphonenumber, DNS/SMTP network operations)
      # Exclude MinGW builds - vcpkg OpenSSL build issues
      # Exclude musl builds - OpenVINO binary components require glibc
      # Exclude ARM64 Linux builds - vcpkg OpenVINO build timeout issues
      # Note: Windows builds WITHOUT OpenVINO (NER unavailable, pattern-based PII works)
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;linux_arm64

  duckdb-v1_5_5-smoke-test:
    name: Smoke test (v1.5.5)
    needs: duckdb-v1_5_5-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.5
      extension_name: anofox_tabular
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;linux_arm64'

  duckdb-v1_5_5-deploy:
    name: Deploy extension binaries (v1.5.5)
    needs: [duckdb-v1_5_5-build, duckdb-v1_5_5-smoke-test]
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.5
      extension_name: anofox_tabular
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;linux_arm64
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

  # Disabled format and tidy checks - local development environment doesn't match CI formatter versions
  # code-quality-check:
