#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-v1_5_6-build:
    name: Build extension binaries (v1.5.6)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_tabular
      # Exclude WASM builds - extension uses features not compatible with WASM
      # (libpostal, libphonenumber, DNS/SMTP network operations)
      # Exclude MinGW builds - vcpkg OpenSSL build issues
      # Exclude musl builds - OpenVINO binary components require glibc
      # Exclude ARM64 Linux builds - vcpkg OpenVINO build timeout issues
      # Note: Windows builds WITHOUT OpenVINO (NER unavailable, pattern-based PII works)
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;linux_arm64

  duckdb-v1_5_6-smoke-test:
    name: Smoke test (v1.5.6)
    needs: duckdb-v1_5_6-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: anofox_tabular
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;linux_arm64'

  duckdb-v1_5_6-deploy:
    name: Deploy extension binaries (v1.5.6)
    needs: [duckdb-v1_5_6-build, duckdb-v1_5_6-smoke-test]
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.6
      extension_name: anofox_tabular
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;linux_arm64
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths only from tag runs: a main push deploy resolves the tag
      # at upload time, so a main run that finishes after a release would
      # overwrite the tag's binaries with a pre-tag build.
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # DuckDB 2.0, the line community-extensions builds repo.ref against: same
  # inputs as its build.yml (docs/dev/updating-duckdb.md). The SQL tests skip
  # here - the prebuilt DuckDB's version string differs from the extension's -
  # so Next20Tests.yml runs them on macOS against a DuckDB built from source.
  duckdb-next-build:
    name: Build extension binaries (v2.0.0)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: v2.0-cyanoptera
      extension_name: anofox_tabular
      artifact_postfix: _v2.0
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;linux_arm64

  # The stock DuckDB 2.0.0 CLI (a tar.gz release asset) installs and loads
  # each 2.0 artifact before it is deployed, as for v1.5.6. On pull requests the
  # v2.0-cyanoptera build skips macOS, so there is no macOS artifact to test.
  duckdb-next-smoke-test:
    name: Smoke test (v2.0.0)
    needs: duckdb-next-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v2.0.0
      extension_name: anofox_tabular
      artifact_postfix: _v2.0
      exclude_archs: ${{ github.event_name == 'pull_request' && 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;linux_arm64;osx_arm64;osx_amd64' || 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;linux_arm64' }}

  # Publishes the 2.0 builds to get.erpl.io/v2.0.0/<platform>/ (and the
  # versioned path on tags) under the same rules as the v1.5.6 deploy. The
  # build job uploads its artifacts as
  # anofox_tabular-v2.0.0-extension-<arch>_v2.0, hence artifact_postfix.
  duckdb-next-deploy:
    name: Deploy extension binaries (v2.0.0)
    needs: [duckdb-next-build, duckdb-next-smoke-test]
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v2.0.0
      extension_name: anofox_tabular
      artifact_postfix: _v2.0
      # No macOS 2.0 artifact on pull requests (see duckdb-next-smoke-test)
      exclude_archs: ${{ github.event_name == 'pull_request' && 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;linux_arm64;osx_arm64;osx_amd64' || 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;linux_arm64' }}
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths only from tag runs (see duckdb-v1_5_6-deploy).
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # Disabled format and tidy checks - local development environment doesn't match CI formatter versions
  # code-quality-check:
  #   name: Code Quality Chec
  #   uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
  #   with:
  #     duckdb_version: v1.5.6
  #     ci_tools_version: v1.5-variegata
  #     extension_name: anofox_tabular
  #     format_checks: 'format;tidy'
